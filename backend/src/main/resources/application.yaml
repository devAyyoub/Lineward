spring:
  application:
    name: lineward
  threads:
    virtual:
      enabled: true

  # The birthright rules are a file of their own, not a block in here. They are
  # what a reviewer reads to know what everybody in the organization holds
  # (ADR-013 decision 10), and that is worth a diff nobody has to find among
  # datasource settings.
  config:
    import: classpath:birthright-rules.yaml

  # Two database roles, and this is the point of ADR-011, not an accident:
  #
  #   lineward_app    the application at runtime. Owns nothing, so row level
  #                   security applies to it and it cannot escape the tenant
  #                   policies.
  #   lineward_owner  owns the tables, so Flyway can create and alter them.
  #
  # If the application connected as the owner, every policy would be silently
  # ignored and the isolation would look installed while doing nothing.
  datasource:
    # 5434 and not 5432, to match infra/docker-compose.yml: this machine already
    # runs a Homebrew PostgreSQL on 5432, and the conventional default silently
    # connects the application to the wrong server. Same variable name as the
    # compose file, so overriding one overrides both.
    url: jdbc:postgresql://${LINEWARD_DB_HOST:localhost}:${LINEWARD_DB_PORT:5434}/${LINEWARD_DB:lineward}
    username: ${LINEWARD_APP_USER:lineward_app}
    password: ${LINEWARD_APP_PASSWORD:lineward_app_local}

  flyway:
    enabled: true
    user: ${LINEWARD_OWNER_USER:lineward_owner}
    password: ${LINEWARD_OWNER_PASSWORD:lineward_owner_local}
    placeholders:
      # V001 revokes UPDATE and DELETE on audit_event from this role, so the
      # name has to match the datasource user above. A placeholder keeps the two
      # in step instead of hardcoding the name inside the migration.
      app_role: ${LINEWARD_APP_USER:lineward_app}

lineward:
  tenant:
    # Must match the organization inserted by
    # V002__installation_organization_and_hr_source.sql. Configuration and not a
    # lookup, because the policy on that table discriminates on the primary key:
    # a query that would find the row needs app.current_org set first, which
    # needs the id.
    org-id: 00000000-0000-7000-8000-000000000001

  identity:
    hr:
      # The simulated HR system of demo-apps/hr-simulator, on 8090.
      base-url: ${LINEWARD_HR_BASE_URL:http://localhost:8090}
      # The source_system row this reader ingests into.
      source-system-code: hr
      # Records per request, and also how many share a transaction.
      page-size: 100
      # Runs a full ingestion at startup. Off by default: it is the development
      # trigger that lets the run be exercised against the real HR system before
      # there is an API or a schedule for it.
      ingest-on-startup: ${LINEWARD_INGEST_ON_STARTUP:false}

  aggregation:
    # Accounts or permissions per request, and also how many share a
    # transaction. A request and not a promise: a target system may return fewer.
    page-size: 100
    # What the target systems call the employee number, which the first
    # correlation rule reads off an account. Both systems this repository ships
    # use this name: the realm declares it in its user profile and the directory
    # sets the standard LDAP attribute of the same name.
    employee-number-attribute: employeeNumber
    # Reads every configured system at startup. Off by default, same reasoning
    # as the ingestion above.
    on-startup: ${LINEWARD_AGGREGATE_ON_STARTUP:false}

  # Where each target system is and which account reads it, keyed by
  # application.code so that the database row and this block are joined on the
  # one name a human can write down and check.
  #
  # Every password comes from the environment (the decision of 2026-11-03). The
  # defaults below only reach the throwaway containers of
  # infra/docker-compose.yml, which is exactly what the datasource above already
  # does, and a real installation sets the variables. No credential in this
  # repository reaches anything real, and the connectors redact their own in
  # logs and exceptions.
  #
  # There is no "type" here: the kind of system is which block is filled in, so
  # a target cannot claim to be one kind and describe another.
  connector:
    targets:
      corporate-directory:
        ldap:
          # 1389 and not 389: the image runs unprivileged and cannot bind 389.
          url: ${LINEWARD_LDAP_URL:ldap://localhost:1389}
          user-search-base: ${LINEWARD_LDAP_USER_BASE:ou=users,dc=lineward,dc=example}
          group-search-base: ${LINEWARD_LDAP_GROUP_BASE:ou=groups,dc=lineward,dc=example}
          # The read only account infra/ldap/init/01-access-rules.sh creates.
          # The directory denies it every write, and a test watches each refusal.
          bind-dn: ${LINEWARD_LDAP_READER_DN:cn=lineward-aggregator,ou=services,dc=lineward,dc=example}
          bind-password: ${LINEWARD_LDAP_READER_PASSWORD:ldap_reader_local}
          # The attribute whose presence means locked. LDAP standardises none,
          # so naming one is a claim about this directory: measured against the
          # image of infra/docker-compose.yml, where the password policy overlay
          # is configured, by LdapConnectorIntegrationTests.
          lock-marker-attribute: pwdAccountLockedTime
      intranet:
        keycloak:
          # 8081 outside the container, because the backend keeps 8080.
          base-url: ${LINEWARD_KEYCLOAK_BASE_URL:http://localhost:8081}
          # Not master: the accounts Lineward governs live in a realm of their
          # own and the service account's rights are scoped to it.
          realm: ${LINEWARD_KEYCLOAK_REALM:lineward}
          # The confidential client of infra/keycloak/import/lineward-realm.json,
          # whose service account holds view-users and nothing more.
          client-id: ${LINEWARD_AGGREGATOR_CLIENT_ID:lineward-aggregator}
          client-secret: ${LINEWARD_AGGREGATOR_SECRET:aggregator_local}
      # An Okta target goes here, and it is commented out rather than given
      # defaults because there is nothing local to point it at. Keycloak and
      # OpenLDAP are containers in infra/docker-compose.yml; an Okta
      # organization is an account somebody owns. Connectors are built eagerly
      # at startup, on purpose, so an uncommented block with no organization
      # behind it would stop the application from starting for everybody.
      #
      # Note what is not here: a secret. Okta authenticates a service
      # application by signature, so what Lineward holds is the path of a
      # private key file, kept out of the environment because variables are
      # readable from a process listing on some systems, land in crash dumps
      # and are inherited by every child process.
      #
      # okta-directory:
      #   okta:
      #     org-url: ${LINEWARD_OKTA_ORG_URL:}
      #     client-id: ${LINEWARD_OKTA_CLIENT_ID:}
      #     # Okta's own identifier for the registered public key, read from the
      #     # console. Not the RFC 7638 thumbprint of the key.
      #     key-id: ${LINEWARD_OKTA_KEY_ID:}
      #     private-key-file: ${LINEWARD_OKTA_PRIVATE_KEY_FILE:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
