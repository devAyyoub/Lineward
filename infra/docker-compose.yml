# Lineward local development stack.
#
# Usage, from this directory:
#   docker compose up -d
#   docker compose down         (keeps data)
#   docker compose down -v      (wipes data, forces the init scripts to run again)
#
# The credentials below are LOCAL DEVELOPMENT DEFAULTS. They are deliberately
# obvious and must never be used anywhere that is reachable from outside this
# machine. Override any of them with a `.env` file next to this one; `.env` is
# git-ignored. Ports are bound to 127.0.0.1 so nothing is exposed to the network.
name: lineward

services:

  # PostgreSQL 18 (ADR-006). Hosts two separate databases: one for Lineward and
  # one for Keycloak. Same server, different databases, so a single container
  # covers local development without pretending they share a schema.
  postgres:
    image: postgres:18.6
    container_name: lineward-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_local}
      POSTGRES_DB: postgres
      # Consumed by the init script. See infra/postgres/init/.
      LINEWARD_DB: ${LINEWARD_DB:-lineward}
      LINEWARD_OWNER_USER: ${LINEWARD_OWNER_USER:-lineward_owner}
      LINEWARD_OWNER_PASSWORD: ${LINEWARD_OWNER_PASSWORD:-lineward_owner_local}
      LINEWARD_APP_USER: ${LINEWARD_APP_USER:-lineward_app}
      LINEWARD_APP_PASSWORD: ${LINEWARD_APP_PASSWORD:-lineward_app_local}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
    ports:
      # 5434 outside, 5432 inside. Not 5432 outside: this machine already runs a
      # Homebrew PostgreSQL on 5432 and another project's container on 5433.
      # Override with LINEWARD_DB_PORT if 5434 is taken too.
      - "127.0.0.1:${LINEWARD_DB_PORT:-5434}:5432"
    volumes:
      # Scripts here run only on an empty data directory, in filename order.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # Mounted at /var/lib/postgresql, NOT at /var/lib/postgresql/data.
      # From PostgreSQL 18 the image stores data in a subdirectory named after
      # the major version, so that pg_upgrade can work across a single mount.
      # Using the old /data path makes the container refuse to start. Nearly
      # every Compose example online still shows the old path. Verified 2026-10-05.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Keycloak 26.7 (ADR-006). Lineward delegates authentication to it; it is not
  # an identity provider that Lineward implements (section 2.3).
  #
  # `start-dev` is development mode: no HTTPS required, no hostname checks,
  # caching disabled. It must never be used in production.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    container_name: lineward-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      # Bootstrap admin. These variable names changed in Keycloak 26: the old
      # KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD pair is no longer what the
      # container documents. Verified 2026-10-05.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
      KC_HEALTH_ENABLED: "true"
      # The secret of the read-only client the connector reads this realm with.
      # It reaches Keycloak as an environment variable and never as a literal in
      # the realm file: a realm import substitutes ${...} from the environment,
      # verified on 26.7.5 both ways, so the committed file names the variable
      # and holds no secret. The default is a local-only value, like the admin
      # password above.
      LINEWARD_AGGREGATOR_SECRET: ${LINEWARD_AGGREGATOR_SECRET:-aggregator_local}
    ports:
      # 8080 inside the container, 8081 outside: the backend keeps 8080.
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      # Realm files here are imported on startup. `lineward-realm.json` is the
      # realm the connector of KAN-7 reads: it declares the user profile
      # attributes correlation needs and the read-only client that reads them.
      #
      # The file name is not free. Keycloak requires `<realm>-realm.json` and
      # refuses to START when the name and the realm inside disagree, rather
      # than warning. Verified on 26.7.5.
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  # OpenLDAP 2.6 (ADR-006): the legacy corporate directory, and the second
  # system Lineward reads. Nothing authenticates against it; it exists to be
  # aggregated.
  #
  # Two things about this service are not obvious and both are load bearing.
  #
  # The image is a frozen one, and that is a decision rather than neglect. The
  # vendor that published the maintained OpenLDAP image moved its catalogue and
  # left this repository without new tags; the most downloaded alternative has
  # no stable tag since 2021; the upstream project publishes nothing current.
  # This is a real OpenLDAP 2.6.10, it runs only here and in the tests, and the
  # day it stops working the answer is a Dockerfile of our own. See ADR-006.
  #
  # The password of the account Lineward reads with never appears in any
  # committed file. The tree in ./ldap/import holds no password at all, and
  # ./ldap/init/01-access-rules.sh creates the reader from the variable below.
  # That script also applies the access rules without which this directory
  # serves every password hash to anybody who asks, with no credential at all.
  openldap:
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    container_name: lineward-openldap
    restart: unless-stopped
    environment:
      LDAP_ROOT: ${LINEWARD_LDAP_ROOT:-dc=lineward,dc=example}
      LDAP_ADMIN_USERNAME: ${LINEWARD_LDAP_ADMIN_USER:-admin}
      LDAP_ADMIN_PASSWORD: ${LINEWARD_LDAP_ADMIN_PASSWORD:-ldap_admin_local}
      # Nothing but the shipped tree decides what this directory holds.
      LDAP_SKIP_DEFAULT_TREE: "yes"
      # Without this the attribute that marks a locked account does not exist
      # and the tree is rejected with "attribute type undefined".
      LDAP_CONFIGURE_PPOLICY: "yes"
      LINEWARD_LDAP_READER_PASSWORD: ${LINEWARD_LDAP_READER_PASSWORD:-ldap_reader_local}
    ports:
      # 1389 inside, because the image runs unprivileged and cannot bind 389.
      - "127.0.0.1:${LINEWARD_LDAP_PORT:-1389}:1389"
    volumes:
      # Loaded once, on an empty data directory, in filename order.
      - ./ldap/import:/ldifs:ro
      # Run once, after the tree is loaded, and with slapd STOPPED: the scripts
      # here cannot talk to the server, which is why that one uses the offline
      # tools.
      - ./ldap/init:/docker-entrypoint-initdb.d:ro
      - openldap-data:/bitnami/openldap
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:1389 -b '' -s base '(objectClass=*)' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  openldap-data:
